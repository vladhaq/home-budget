<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Домашний бюджет</title>
<script>
  (function () {  // тема до отрисовки страницы: выбор пользователя, иначе — как в системе
    var t = null;
    try { t = localStorage.getItem("budget-theme"); } catch (e) {}
    document.documentElement.dataset.theme = t || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  })();
</script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="side-head"><div class="logo"></div><div class="side-title"><b>Бюджет</b><span>домашний учёт</span></div></div>
    <nav id="nav"></nav>
  </aside>
  <div class="content">
    <header class="top">
      <div class="topbar">
        <div class="ttl"><h1 id="ptitle">Обзор</h1><div class="banner" id="banner"></div></div>
        <label class="search"><span id="qicon"></span><input id="q" placeholder="Поиск: товар или магазин" autocomplete="off"></label>
        <button class="iconbtn" id="themebtn" type="button"></button>
      </div>
    </header>
    <div class="filters" id="filters"></div>
    <main id="main"></main>
  </div>
</div>
<div id="popup"></div>
<div id="picker"><input placeholder="поиск категории…"><div class="list"></div></div>
<div id="savebar"><span id="savecount"></span><button class="no" id="cancelbtn">Отменить</button>
  <button class="ok" id="savebtn">Сохранить</button></div>
<div id="toast"></div>
<div id="modal"><div class="mbox"><h3></h3><p></p><input autocomplete="off">
  <div class="mbtns"><button class="mno" type="button">Отмена</button><button class="mok" type="button">OK</button></div></div></div>

<script src="/static/js/core.js"></script>
<script src="/static/js/overview.js"></script>
<script src="/static/js/pages.js"></script>
<script src="/static/js/deals.js"></script>
<script src="/static/js/settings.js"></script>
<script src="/static/js/main.js"></script>
</body>
</html>
