<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Домашний бюджет</title>
<script>
  (function () {  // тема до отрисовки страницы: выбор пользователя, иначе — как в системе
    var t = null;
    try { t = localStorage.getItem("budget-theme"); } catch (e) {}
    document.documentElement.dataset.theme = t || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  })();
</script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
/* Дизайн по мотивам Telegram: светлая тема — Telegram Web, тёмная — «ночная» Telegram Desktop */
:root {
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
  --ease: cubic-bezier(.2, .8, .2, 1);
  --r: 14px;
  --bg: #f1f2f6; --panel: #ffffff; --panel-2: #f4f4f5; --panel-3: #e8e9ed;
  --hover: rgba(112, 117, 121, .08); --glass: rgba(255, 255, 255, .82);
  --text: #0f1419; --text-2: #707579; --text-3: #a3abb3; --line: #eceef1; --border: #dfe1e5;
  --accent: #3390ec; --btn: #3390ec; --btn-h: #2a7fd6; --accent-soft: rgba(51, 144, 236, .12);
  --sel: #3390ec; --sel-text: #ffffff;
  --green: #2e9e46; --red: #e53935; --orange: #e08a00;
  --c-blue: #3390ec; --c-green: #4fae4e; --c-violet: #8774e1; --c-orange: #f5a623; --c-gray: #9aa6b2; --c-gray2: #cdd4db;
  --c-red: #e53935;
  --shadow: 0 1px 2px rgba(16, 35, 47, .07), 0 1px 8px rgba(16, 35, 47, .04);
  --shadow-pop: 0 10px 34px rgba(16, 35, 47, .18), 0 2px 6px rgba(16, 35, 47, .08);
  --log-bg: #101a24;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #0e1621; --panel: #17212b; --panel-2: #202b36; --panel-3: #2b3846;
  --hover: rgba(255, 255, 255, .045); --glass: rgba(23, 33, 43, .84);
  --text: #f5f5f5; --text-2: #7f91a4; --text-3: #55677a; --line: #101a24; --border: #2a3644;
  --accent: #6ab3f3; --btn: #5288c1; --btn-h: #5e96d0; --accent-soft: rgba(106, 179, 243, .13);
  --sel: #2b5278; --sel-text: #ffffff;
  --green: #5dc163; --red: #ef5b5b; --orange: #f0a742;
  --c-blue: #6ab3f3; --c-green: #5dc163; --c-violet: #9d8cf2; --c-orange: #f0a742; --c-gray: #6c7f92; --c-gray2: #3a4b5c;
  --c-red: #ef5b5b;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3);
  --shadow-pop: 0 12px 36px rgba(0, 0, 0, .5), 0 2px 6px rgba(0, 0, 0, .3);
  --log-bg: #0a1118;
  color-scheme: dark;
}
* { box-sizing: border-box; scrollbar-width: thin; scrollbar-color: var(--panel-3) transparent; }
body { margin: 0; font: 15px/1.45 var(--font); color: var(--text); background: var(--bg); -webkit-font-smoothing: antialiased; }
button, select, input { font: inherit; color: inherit; }
a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg.i { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- каркас: разделы слева (как список чатов), содержимое справа (как открытый чат) */
.app { display: grid; grid-template-columns: 300px minmax(0, 1fr); min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; overflow-y: auto; z-index: 6; display: flex; flex-direction: column;
  background: var(--panel); border-right: 1px solid var(--line); }
.side-head { display: flex; align-items: center; gap: 12px; padding: 14px 18px 12px; }
.logo { width: 42px; height: 42px; border-radius: 50%; flex: none; display: grid; place-items: center; color: #fff;
  background: linear-gradient(135deg, #72d5fd, #2a9ef1); box-shadow: 0 4px 14px rgba(42, 158, 241, .35); }
.logo svg { width: 23px; height: 23px; }
.side-title { line-height: 1.25; } .side-title b { display: block; font-size: 17px; }
.side-title span { font-size: 13px; color: var(--text-2); }
#nav { display: flex; flex-direction: column; gap: 2px; padding: 4px 8px 16px; }
.chat { position: relative; overflow: hidden; display: grid; grid-template-columns: 48px minmax(0, 1fr) auto;
  grid-template-areas: "ico t tm" "ico s bd"; column-gap: 12px; align-items: center; width: 100%; padding: 8px 10px;
  border: 0; border-radius: 12px; background: none; text-align: left; cursor: pointer; transition: background-color .2s; }
.chat:hover { background: var(--hover); }
.chat.on { background: var(--sel); color: var(--sel-text); }
.chat .ico { grid-area: ico; width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; color: #fff;
  background: linear-gradient(var(--a), var(--b)); transition: transform .3s var(--ease), box-shadow .3s; }
.chat:active .ico { transform: scale(.92); }
.chat .t { grid-area: t; align-self: end; font-weight: 600; font-size: 15.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chat .s { grid-area: s; align-self: start; font-size: 14px; color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chat .tm { grid-area: tm; align-self: end; font-size: 12.5px; color: var(--text-2); }
.chat .bd { grid-area: bd; align-self: start; justify-self: end; min-height: 22px; }
.chat.on .s, .chat.on .tm { color: rgba(255, 255, 255, .78); }
.chat .s .spin { width: 11px; height: 11px; }
.badge { display: inline-grid; place-items: center; min-width: 22px; height: 22px; padding: 0 7px; border-radius: 11px;
  background: var(--btn); color: #fff; font-size: 12.5px; font-weight: 600; line-height: 1; animation: pop .35s var(--ease); }
.badge.red { background: var(--red); }
.chat.on .badge { background: #fff; color: var(--sel); }

.content { min-width: 0; display: flex; flex-direction: column; }
header.top { position: sticky; top: 0; z-index: 5; background: var(--glass); border-bottom: 1px solid var(--line);
  backdrop-filter: saturate(180%) blur(16px); -webkit-backdrop-filter: saturate(180%) blur(16px); }
.topbar { display: flex; align-items: center; gap: 12px; min-height: 58px; padding: 8px 20px; }
.ttl { flex: 1 1 0; min-width: 0; } .ttl h1 { margin: 0; font-size: 17px; font-weight: 600; line-height: 1.25; }
.banner { font-size: 13.5px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.banner .warn { color: var(--orange); }
.search { position: relative; display: block; }
.search svg { position: absolute; left: 12px; top: 50%; width: 18px; height: 18px; transform: translateY(-50%); color: var(--text-2); pointer-events: none; }
label.search input { width: 220px; height: 38px; padding: 0 14px 0 38px; border: 2px solid transparent; border-radius: 19px;
  background: var(--panel-2); outline: none; transition: width .35s var(--ease), border-color .2s, background-color .2s; }
label.search input:focus { width: 300px; box-shadow: none; border-color: var(--accent); background: var(--panel); }
label.search input::placeholder { color: var(--text-2); }
body[data-page="settings"] .search, body[data-page="deals"] .search { visibility: hidden; }
.iconbtn { position: relative; overflow: hidden; flex: none; width: 40px; height: 40px; border: 0; border-radius: 50%;
  background: none; color: var(--text-2); display: grid; place-items: center; cursor: pointer; transition: background-color .15s, color .15s; }
.iconbtn:hover { background: var(--hover); color: var(--text); }
.iconbtn svg { transition: transform .6s var(--ease); } .iconbtn:hover svg { transform: rotate(-25deg); }

.filters { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; width: 100%; max-width: 1240px; margin: 0 auto;
  padding: 14px 20px 0; font-size: 14px; }
.filters:empty { display: none; }
.filters > span { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.filters label { color: var(--text-2); font-size: 13px; }
select, input:not([type]), input[type="text"], input[type="time"], input[type="datetime-local"] {
  background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 6px 10px; outline: none;
  transition: border-color .15s, box-shadow .15s; }
select:focus, input:not([type]):focus, input[type="time"]:focus, input[type="datetime-local"]:focus {
  border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
input[type="checkbox"] { accent-color: var(--btn); }

main { width: 100%; max-width: 1240px; margin: 0 auto; padding: 16px 20px 96px; }
h2 { margin: 26px 4px 10px; font-size: 15px; font-weight: 600; color: var(--accent); letter-spacing: .01em; }
p { margin: 8px 4px; }
.muted { color: var(--text-2); font-size: 13.5px; }
.src { margin-left: 4px; font-size: 12px; color: var(--text-3); }
.save, .down { color: var(--green); } .up { color: var(--red); } .warn { color: var(--orange); }

/* ---------- панели */
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(175px, 1fr)); gap: 10px; margin: 4px 0 16px; }
.card { padding: 12px 14px; border-radius: var(--r); background: var(--panel); box-shadow: var(--shadow); font-size: 13px;
  color: var(--text-2); transition: transform .3s var(--ease), box-shadow .3s; }
.card:hover { transform: translateY(-2px); box-shadow: var(--shadow-pop); }
.card b { display: block; margin: 3px 0 2px; font-size: 22px; font-weight: 600; color: var(--text); letter-spacing: -.015em;
  font-variant-numeric: tabular-nums; white-space: nowrap; }
.card b.save { color: var(--green); } .card b.up { color: var(--red); }
.chartbox { margin: 6px 0 16px; padding: 14px 14px 8px; border-radius: var(--r); background: var(--panel); box-shadow: var(--shadow); }
.updbox, .form { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; margin: 6px 0 12px; padding: 14px 16px;
  border-radius: var(--r); background: var(--panel); box-shadow: var(--shadow); }
.form { align-items: end; }
.form label { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: var(--text-2); }
.updbox .big { font-size: 15px; }
.empty { padding: 70px 20px; text-align: center; color: var(--text-2); font-size: 16px; }
.empty::before { content: ""; display: block; width: 88px; height: 88px; margin: 0 auto 18px; border-radius: 50%;
  background: radial-gradient(circle, var(--accent) 0 9px, transparent 10px), var(--accent-soft); animation: breathe 2.6s ease-in-out infinite; }

/* ---------- таблицы */
table { width: 100%; margin: 6px 0 16px; border-collapse: separate; border-spacing: 0; border-radius: var(--r);
  background: var(--panel); box-shadow: var(--shadow); }
th, td { padding: 9px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; font-size: 14px; }
th { color: var(--text-2); font-weight: 500; font-size: 12.5px; white-space: nowrap; user-select: none; }
th[data-sort] { cursor: pointer; } th[data-sort]:hover { color: var(--accent); }
tr:last-child > td { border-bottom: 0; }
tr:first-child > :first-child { border-top-left-radius: var(--r); } tr:first-child > :last-child { border-top-right-radius: var(--r); }
tr:last-child > :first-child { border-bottom-left-radius: var(--r); } tr:last-child > :last-child { border-bottom-right-radius: var(--r); }
td { transition: background-color .15s; }
tr:hover > td { background: var(--hover); }
td.n, th.n { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
td code { white-space: normal; }
#banklist td:first-child, .occt td:first-child { white-space: nowrap; }
.tree td:first-child { white-space: nowrap; }
table table { margin: 4px 0; border-radius: 10px; background: var(--panel-2); box-shadow: none; }
table table th, table table td { padding: 7px 10px; font-size: 13px; }
tr.pending > td, tr.selrow > td, tr.opened > td { background: var(--accent-soft); }
tr.err > td { background: color-mix(in srgb, var(--red) 9%, transparent); }
tr.wrn > td { background: color-mix(in srgb, var(--orange) 10%, transparent); }
tr.occ > td, tr.occ:hover > td { padding: 6px 12px 12px 26px; background: var(--panel-2); }
tr.occ.fresh > td > table { animation: drop .35s var(--ease); }
table.occt { background: var(--panel); } table.occt td { vertical-align: top; } .occt .muted { font-size: 12.5px; }
#banklist { scroll-margin-top: 76px; }
.tscroll { overflow-x: auto; margin: 6px 0 16px; border-radius: var(--r); box-shadow: var(--shadow); }
.tscroll > table { margin: 0; box-shadow: none; }
#banktable td:first-child { white-space: nowrap; }
.bar { height: 6px; border-radius: 3px; transform-origin: left;
  background: linear-gradient(90deg, var(--c-blue), color-mix(in srgb, var(--c-blue) 50%, #a8e1ff)); }
.enter .bar { animation: grow .9s var(--ease) both; }

/* ---------- кнопки, чипы, выбор категории */
.btn { position: relative; overflow: hidden; display: inline-flex; align-items: center; gap: 8px; padding: 9px 18px; border: 0;
  border-radius: 10px; background: var(--btn); color: #fff; font-weight: 600; font-size: 14.5px; cursor: pointer;
  box-shadow: 0 2px 8px color-mix(in srgb, var(--btn) 35%, transparent); transition: background-color .15s, transform .12s; }
.btn:hover { background: var(--btn-h); } .btn:active { transform: scale(.97); }
.btn:disabled { background: var(--panel-3); color: var(--text-2); box-shadow: none; cursor: default; transform: none; }
.chip { position: relative; overflow: hidden; padding: 5px 12px; border: 0; border-radius: 16px; background: var(--panel);
  box-shadow: var(--shadow); font-size: 13.5px; white-space: nowrap; cursor: pointer; transition: background-color .15s, color .15s, transform .12s; }
.chip:hover { background: var(--panel-2); } .chip:active { transform: scale(.96); }
td .chip, .updbox .chip, .form .chip { background: var(--panel-2); box-shadow: none; }  /* внутри панелей — без тени */
td .chip:hover, .updbox .chip:hover, .form .chip:hover { background: var(--panel-3); }
.filters .catpick { background: var(--panel); box-shadow: var(--shadow); }
.chip.on, td .chip.on { background: var(--btn); color: #fff; }
.chip:disabled { opacity: .5; cursor: default; transform: none; }
.chip.act { margin: 1px 0; padding: 3px 10px; font-size: 12.5px; }
.catpick { max-width: 280px; padding: 4px 10px; border: 0; border-radius: 8px; background: var(--panel-2); font-size: 13px;
  text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; transition: background-color .15s, color .15s; }
.catpick:hover { background: var(--panel-3); }
.occt .catpick { max-width: 190px; }
@media (max-width: 1100px) { .catpick { max-width: 210px; } }
.catpick.unknown { background: color-mix(in srgb, var(--orange) 15%, transparent); color: var(--orange); }
.catpick.pending { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.only { margin-left: 6px; font-size: 12px; color: var(--text-2); white-space: nowrap; }
.cellbtn, .linkbtn { padding: 0; border: 0; background: none; cursor: pointer; transition: color .15s, border-color .15s;
  border-bottom: 1px dashed color-mix(in srgb, currentColor 45%, transparent); }
.cellbtn:hover, .linkbtn:hover { color: var(--accent); border-bottom-color: var(--accent); }
.cellbtn.sel { color: var(--accent); font-weight: 700; border-bottom: 2px solid var(--accent); }
.nav { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 20px 0 10px; }
.nav h2 { margin: 0 4px; color: var(--text); font-size: 20px; font-weight: 600; }
.nav > button:not(.chip) { position: relative; overflow: hidden; width: 38px; height: 38px; border: 0; border-radius: 50%;
  background: var(--panel); box-shadow: var(--shadow); font-size: 22px; line-height: 1; cursor: pointer; transition: background-color .15s; }
.nav > button:not(.chip):hover { background: var(--panel-2); } .nav > button:disabled { opacity: .35; cursor: default; }
.tabs { position: relative; display: inline-flex; gap: 2px; margin: 4px 0 8px; padding: 3px; border-radius: 12px; background: var(--panel-3); }
:root[data-theme="dark"] .tabs { background: var(--panel); }
.tabs button { position: relative; z-index: 1; overflow: hidden; padding: 6px 16px; border: 0; border-radius: 9px; background: none;
  color: var(--text-2); font-weight: 500; cursor: pointer; transition: color .25s; }
.tabs button.on { color: var(--text); }
.tabs .ind { position: absolute; z-index: 0; top: 3px; bottom: 3px; left: 3px; width: 0; border-radius: 9px; background: var(--panel);
  box-shadow: var(--shadow); transition: left .35s var(--ease), width .35s var(--ease); }
:root[data-theme="dark"] .tabs .ind { background: var(--panel-3); }
.st { display: inline-flex; align-items: center; gap: 3px; padding: 1px 9px; border-radius: 10px; font-size: 12px; font-weight: 600;
  white-space: nowrap; color: var(--c); background: color-mix(in srgb, var(--c) 16%, transparent); }
.ava { display: inline-grid; place-items: center; flex: none; width: 34px; height: 34px; border-radius: 50%; color: #fff;
  background: linear-gradient(var(--a), var(--b)); font-size: 13px; font-weight: 600; letter-spacing: -.02em; vertical-align: middle; }
.ava.sm { width: 28px; height: 28px; font-size: 11.5px; }
summary .ava { margin-right: 8px; }
.who { display: flex; align-items: center; gap: 10px; min-width: 0; }
code { padding: 2px 7px; border-radius: 6px; background: var(--panel-2); font: 12.5px/1.4 var(--mono); white-space: nowrap; }
code[data-copy] { cursor: copy; transition: background-color .15s, color .15s; }
code[data-copy]:hover { background: var(--accent-soft); color: var(--accent); }
pre.log { max-height: 340px; overflow: auto; margin: 6px 0; padding: 12px; border-radius: 10px; background: var(--log-bg);
  color: #d5e1ee; font: 12px/1.5 var(--mono); white-space: pre-wrap; }
details { margin: 6px 0; border-radius: 12px; background: var(--panel); box-shadow: var(--shadow); }
details > summary { display: block; list-style: none; padding: 10px 14px; border-radius: 12px; cursor: pointer; transition: background-color .15s; }
details > summary::-webkit-details-marker { display: none; }
details > summary::before { content: ""; display: inline-block; width: 7px; height: 7px; margin: 0 10px 2px 2px; vertical-align: middle;
  border-right: 2px solid var(--text-2); border-bottom: 2px solid var(--text-2); transform: rotate(-45deg); transition: transform .3s var(--ease); }
details[open] > summary::before { transform: rotate(45deg); }
details > summary:hover { background: var(--hover); }
details[open] > summary ~ * { animation: drop .3s var(--ease); }
details > .tscroll { margin: 0 10px 10px; border-radius: 10px; box-shadow: none; }
details > .tscroll > table { background: var(--panel-2); }
td details { margin: 2px 0; background: none; box-shadow: none; }
td details > summary { padding: 2px 0; }

/* ---------- всплывающие: меню категорий, панель «Сохранить», уведомления */
#popup, #picker { position: absolute; display: none; border: 1px solid var(--border); border-radius: 14px; background: var(--glass);
  backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%); box-shadow: var(--shadow-pop);
  transform-origin: top left; animation: menu .2s var(--ease); }
#popup { z-index: 15; padding: 6px; font-size: 14px; }
#popup button { display: block; width: 100%; margin: 2px 0; padding: 8px 12px; border: 0; border-radius: 8px; background: none; text-align: left; cursor: pointer; }
#popup button:hover { background: var(--hover); }
#picker { z-index: 16; width: 340px; overflow: hidden; }
#picker input { width: 100%; padding: 12px 14px; border: 0; border-bottom: 1px solid var(--border); border-radius: 0; background: transparent; box-shadow: none; }
#picker .list { max-height: 340px; overflow: auto; padding: 6px; }
#picker .opt { padding: 7px 10px; border-radius: 8px; font-size: 14px; cursor: pointer; transition: background-color .12s; }
#picker .opt:hover { background: var(--hover); } #picker .opt.hl { background: var(--accent-soft); }
#picker .opt .par { color: var(--text-2); } #picker .opt.top { font-weight: 600; }
#savebar { position: fixed; left: 50%; bottom: 18px; z-index: 12; display: none; align-items: center; gap: 10px;
  width: min(560px, calc(100% - 24px)); padding: 10px 10px 10px 18px; border-radius: 16px; background: var(--panel);
  box-shadow: var(--shadow-pop); transform: translateX(-50%); animation: bar-in .35s var(--ease); }
#savecount { margin-right: auto; font-size: 14px; }
#savebar button { position: relative; overflow: hidden; padding: 8px 16px; border: 0; border-radius: 10px; font-weight: 600; cursor: pointer; }
#savebar .ok { background: var(--btn); color: #fff; } #savebar .no { background: var(--panel-2); }
#toast { position: fixed; left: 50%; bottom: 24px; z-index: 30; max-width: calc(100% - 32px); padding: 10px 18px; border-radius: 12px;
  background: rgba(20, 24, 28, .88); color: #fff; font-size: 14px; box-shadow: 0 6px 24px rgba(0, 0, 0, .25);
  backdrop-filter: blur(10px); opacity: 0; pointer-events: none; transform: translate(-50%, 16px) scale(.97);
  transition: opacity .25s var(--ease), transform .35s var(--ease); }
#toast.show { opacity: 1; transform: translate(-50%, 0); }
body.saving #toast { bottom: 88px; }

/* ---------- окно подтверждения и ввода (как всплывающие окна Telegram) */
#modal { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; background: rgba(0, 0, 0, .42);
  opacity: 0; pointer-events: none; transition: opacity .2s; }
#modal.show { opacity: 1; pointer-events: auto; }
.mbox { width: min(420px, calc(100% - 32px)); padding: 20px 20px 12px; border-radius: 16px; background: var(--panel);
  box-shadow: var(--shadow-pop); transform: scale(.9); transition: transform .35s var(--ease); }
#modal.show .mbox { transform: none; }

<script>

};
// разделы — как чаты: цвета аватаров Telegram
const PAGES = [
  {k: "overview", t: "Обзор", c: ["#72d5fd", "#2a9ef1"]}, {k: "bank", t: "Банк", c: ["#a0de7e", "#54cb68"]},
  {k: "cash", t: "Наличные", c: ["#ffcd6a", "#ffa85c"]}, {k: "deals", t: "Скидки", c: ["#e0a2f3", "#d669ed"]}, {k: "unknown", t: "Неопознанные", short: "Неопозн.", c: ["#ff885e", "#ff516a"]},

const AVA = [["#ff885e", "#ff516a"], ["#ffcd6a", "#ffa85c"], ["#82b1ff", "#665fff"], ["#a0de7e", "#54cb68"],
             ["#53edd6", "#28c9b7"], ["#72d5fd", "#2a9ef1"], ["#e0a2f3", "#d669ed"]];

  const s = String(name || "?").trim();
  let h = 0; for (const ch of s.toLowerCase()) h = (h * 31 + ch.charCodeAt(0)) >>> 0;

const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const alpha = (hex, a) => { const n = parseInt(hex.replace("#", ""), 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`; };

const THEME_KEY = "budget-theme";
const themeStored = () => { try { return localStorage.getItem(THEME_KEY); } catch (e) { return null; } };
function applyTheme(th) {
  document.documentElement.dataset.theme = th;
  const b = document.getElementById("themebtn");
  b.innerHTML = th === "dark" ? ICON.sun : ICON.moon;

async function toggleTheme(e) {  // круговое раскрытие новой темы от кнопки — как в Telegram
  const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  try { localStorage.setItem(THEME_KEY, next); } catch (err) { /* без сохранения — только до перезагрузки */ }
  const swap = () => { applyTheme(next); if (D) render(); };

}
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", e => {

function animateEnter(el) {  // появление содержимого снизу с задержкой по блокам + счётчики в карточках

function countUp(el) {
  const m = el.textContent.match(/^(-?)([\d\u00a0\u202f ]+)(?:,(\d+))?(\s*(?:zł|%))?$/);
  if (!m) return;

const chartAnim = () => CHART_ANIM && !REDUCED.matches ? {duration: 700} : false;
function modal({title, text = "", value = null, placeholder = "", ok = "OK", danger = false}) {
  // окно подтверждения (value = null) или ввода строки; resolve: true / введённый текст, или null — отмена
  return new Promise(resolve => {

async function load() {

// ---------- фильтры
function descendants(id) {
  const out = new Set([+id]);
  for (const k of KIDS[id] || []) for (const x of descendants(k.id)) out.add(x);
  return out;
}

function filtered() {
  const F = S.F, cats = F.cat === "" ? null : F.cat === "none" ? "none" : descendants(F.cat);
  const res = [];
  for (const p of D.purchases) {
    const m = p.date.slice(0, 7);
    if (F.from && m < F.from) continue;
    if (F.to && m > F.to) continue;
    if (F.pay.size && !F.pay.has(p.pay ?? "unknown")) continue;
    if (F.merchant && p.merchant !== F.merchant) continue;
    if (F.source && p.source !== F.source) continue;
    // поиск: магазин целиком или отдельные позиции по названию
    const fq = F.q ? foldTxt(F.q) : "", shopHit = !fq || foldTxt(`${p.merchant} ${p.store}`).includes(fq);
    // переводы людям, банкомат, взносы — не расходы: в суммы не идут, если не выбраны фильтром явно
    const items = p.items.filter(it => (cats ? (cats === "none" ? it.cat == null : cats.has(it.cat))
                                             : !(it.cat != null && CAT[it.cat] && CAT[it.cat].kind !== "expense"))
                                       && (shopHit || foldTxt(`${it.name} ${it.note || ""}`).includes(fq)));
    if (!items.length) continue;
    const value = items.reduce((s, it) => s + net(it), 0);
    res.push({...p, items, value, saved: items.reduce((s, it) => s + (it.discount || 0), 0)});
  }
  return res;
}

function renderFilters() {
  const months = [...new Set(D.purchases.map(p => p.date.slice(0, 7)))].sort();
  const monthOpts = sel => `<option value="">—</option>` + months.map(m =>
    `<option value="${m}" ${m === sel ? "selected" : ""}>${m.slice(5)}.${m.slice(0, 4)}</option>`).join("");
  const pays = [...new Set(D.purchases.map(p => p.pay ?? "unknown"))];
  const merchants = [...new Set(D.purchases.map(p => p.merchant))].sort();
  const sources = [...new Set(D.purchases.map(p => p.source))];
  document.getElementById("filters").innerHTML = `
    <span><label>период</label> <select data-f="from">${monthOpts(S.F.from)}</select> –
      <select data-f="to">${monthOpts(S.F.to)}</select></span>
    <span><label>оплата</label> ${pays.map(k => `<button class="chip ${S.F.pay.has(k) ? "on" : ""}" data-pay="${k}">${esc(D.payments[k] || k)}</button>`).join(" ")}</span>
    <span><label>магазин</label> <select data-f="merchant"><option value="">все</option>${merchants.map(m =>
      `<option ${m === S.F.merchant ? "selected" : ""}>${esc(m)}</option>`).join("")}</select></span>
    <span><label>категория</label> ${catPick(S.F.cat, "filter")}</span>
    <span><label>источник</label> <select data-f="source"><option value="">все</option>${sources.map(s =>

    <button class="chip" id="reset">сбросить</button>`;
}

const catLabel = id => id == null || id === "" ? "⚠ неопознанные" : CAT[id] ? CAT[id].path.replaceAll("/", " › ") : "?";
const foldTxt = s => s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/ł/g, "l");
const sortedCats = () => Object.values(CAT).sort((a, b) => a.path.localeCompare(b.path, "ru"));

// ctx: filter | same (все такие) | item (позиция в чеке) | move (перенос категории)
function catPick(current, ctx, data = {}) {
  const key = pendKey(ctx, data);
  const p = key && PENDING.get(key);
  const shown = p ? p.cat : current;
  const label = ctx === "filter" ? (current === "" ? "все" : current === "none" ? "⚠ неопознанные" : catLabel(current)) : catLabel(shown);
  const attrs = Object.entries(data).map(([k, v]) => `data-${k}="${esc(v)}"`).join(" ");
  const cls = p ? "pending" : (shown == null && ctx !== "filter" && ctx !== "move" ? "unknown" : "");
  const only = p && ctx === "item" ? `<label class="only"><input type="checkbox" data-only="${esc(key)}" ${p.mode === "item" ? "checked" : ""}> только эта</label>` : "";
  return `<button type="button" class="catpick ${cls}" data-ctx="${ctx}" ${attrs} title="${esc(label)}">${esc(label)} ▾</button>${only}`;
}
const pendKey = (ctx, d) => ctx === "same" ? "same|" + d.name : ctx === "item" ? `item|${d.pid}|${d.line}`
  : ctx === "tx" ? "tx|" + d.tx : null;

let PICK = null;
function openPicker(btn) {
  PICK = btn;

  box.style.left = Math.min(r.left + scrollX, scrollX + innerWidth - 360) + "px";

function drawPicker(q) {
  const ctx = PICK.dataset.ctx, f = foldTxt(q.trim());
  let opts = [];
  if (ctx === "filter") opts.push({v: "", t: "все категории"}, {v: "none", t: "⚠ неопознанные"});
  else if (ctx === "move") opts.push({v: "", t: "— на верхний уровень"});
  else opts.push({v: "", t: "⚠ неопознанные (без категории)"});
  for (const c of sortedCats()) {
    if (ctx === "move" && (c.id === +PICK.dataset.id || descendants(PICK.dataset.id).has(c.id))) continue;
    const parts = c.path.split("/");
    opts.push({v: c.id, t: c.path, html: (parts.length > 1 ? `<span class="par">${esc(parts.slice(0, -1).join(" › "))} › </span>` : "")
      + esc(parts[parts.length - 1]), top: parts.length === 1});
  }
  if (f) opts = opts.filter(o => foldTxt(o.t).includes(f));
  document.querySelector("#picker .list").innerHTML = opts.map((o, i) =>
    `<div class="opt ${o.top ? "top" : ""} ${i === 0 && f ? "hl" : ""}" data-v="${o.v}">${o.html || esc(o.t)}</div>`).join("")
    || `<div class="opt muted">ничего не найдено</div>`;
}

}

// ---------- обзор
let chart = null;
function renderOverview() {
  const ps = filtered();
  const byMonth = {};
  for (const p of ps) (byMonth[p.date.slice(0, 7)] ??= []).push(p);
  const labels = Object.keys(byMonth).sort();

  if (!labels.length) { main.innerHTML = `<div class="empty">По выбранным фильтрам ничего нет.</div>`; return; }

  main.innerHTML = `<p class="muted">Нажми на столбец месяца — ниже откроется полная статистика.</p>
    <div class="chartbox"><canvas id="chart" height="110"></canvas></div><section id="panel"></section>`;
  const spent = labels.map(m => +byMonth[m].reduce((s, p) => s + p.value, 0).toFixed(2));
  const saved = labels.map(m => +byMonth[m].reduce((s, p) => s + p.saved, 0).toFixed(2));
  chart?.destroy();
  chart = new Chart(document.getElementById("chart"), {
    type: "bar",
    data: {labels: labels.map(m => m.slice(5) + "." + m.slice(2, 4)), datasets: [
      {label: "потрачено, zł", data: spent,
       backgroundColor: labels.map(m => m === S.month || S.month === "all" ? css("--c-blue") : alpha(css("--c-blue"), .4))},
      {label: "сэкономлено на скидках, zł", data: saved,
       backgroundColor: labels.map(m => m === S.month || S.month === "all" ? css("--c-green") : alpha(css("--c-green"), .4))}]},
    options: {animation: chartAnim(), interaction: {mode: "index", intersect: false}, plugins: {legend: {position: "bottom"}},
      scales: {x: {grid: {display: false}}},
      onClick: (e, els) => { if (els.length) { const m = labels[els[0].index];
        S.month = S.month === m ? "all" : m;  // повторный клик по выбранному месяцу — снова «всё время»
        CHART_ANIM = false; renderOverview();
        animateEnter(document.getElementById("panel")); } },
      onHover: (e, els) => { e.native.target.style.cursor = els.length ? "pointer" : "default"; }},
  });
  renderPanel(labels, byMonth, spent, saved);
}

function renderPanel(labels, byMonth, spent, saved) {
  const all = S.month === "all", i = labels.indexOf(S.month);
  const rs = (all ? labels.flatMap(m => byMonth[m]) : byMonth[S.month]).slice().sort((a, b) => a.date < b.date ? -1 : 1);
  const total = all ? spent.reduce((a, b) => a + b, 0) : spent[i], disc = all ? saved.reduce((a, b) => a + b, 0) : saved[i];
  const diff = !all && i > 0 && spent[i - 1] ? (total / spent[i - 1] - 1) * 100 : null;
  const items = aggregate(rs), nItems = rs.reduce((s, r) => s + r.items.length, 0);
  const byDay = {}; for (const r of rs) byDay[r.date.slice(0, 10)] = (byDay[r.date.slice(0, 10)] || 0) + r.value;
  const topDay = Object.entries(byDay).sort((a, b) => b[1] - a[1])[0];
  const title = all ? `всё время <span class="muted">(${monthName(labels[0])} – ${monthName(labels[labels.length - 1])})</span>` : monthName(S.month);
  document.getElementById("panel").innerHTML = `
    <div class="nav"><button ${i > 0 ? "" : "disabled"} data-month="${labels[i - 1]}" title="предыдущий месяц">‹</button>
      <h2>${title}</h2>
      <button ${!all && i < labels.length - 1 ? "" : "disabled"} data-month="${labels[i + 1]}" title="следующий месяц">›</button>
      <button class="chip ${all ? "on" : ""}" data-month="all" style="margin-left:auto">всё время</button></div>
    <div class="cards">
      <div class="card">потрачено<b>${zl(total)}</b>${diff === null ? "" :
        `<span class="${diff > 0 ? "up" : "down"}">${diff > 0 ? "+" : ""}${diff.toFixed(0)}% к прошлому месяцу</span>`}</div>
      <div class="card">сэкономлено<b class="save">${zl(disc)}</b>${(disc / (total + disc) * 100 || 0).toFixed(0)}% от цены без скидок</div>
      <div class="card">покупок<b>${rs.length}</b>средняя ${zl(total / rs.length)}${all ? `<br>в месяц ${zl(total / labels.length)}` : ""}</div>
      <div class="card">позиций<b>${nItems}</b>разных товаров: ${items.length}</div>
      <div class="card">самый дорогой день<b>${topDay[0].slice(8, 10)}.${topDay[0].slice(5, 7)}</b>${zl(topDay[1])}</div>
    </div>
    <div class="tabs" data-key="view">${[["cats", "категории"], ["items", "товары"], ["receipts", "чеки"]].map(([k, t]) =>
      `<button class="${S.view === k ? "on" : ""}" data-view="${k}">${t}</button>`).join("")}</div>
    <div id="body">${S.view === "items" ? itemsTable(items) : S.view === "cats" ? catsTable(rs) : receiptsList(rs)}</div>`;
  placeIndicators();
}

function aggregate(rs) {
  const agg = {};
  for (const r of rs) for (const it of r.items) {
    const a = agg[it.name.toLowerCase()] ??= {name: it.name, times: 0, qty: 0, spent: 0, discount: 0, cats: {}, srcs: {},
                                               merchants: new Set(), occ: []};
    a.occ.push({p: r, it});
    a.times += 1; a.qty += it.qty || 1; a.spent += net(it); a.discount += it.discount || 0;
    a.cats[it.cat ?? ""] = (a.cats[it.cat ?? ""] || 0) + 1; a.srcs[it.cat_src ?? ""] = 1; a.merchants.add(r.merchant);
  }
  for (const a of Object.values(agg)) {
    const [top] = Object.entries(a.cats).sort((x, y) => y[1] - x[1]);
    a.cat = top[0] === "" ? null : +top[0];
    a.mixed = Object.keys(a.cats).length > 1;
    a.catName = a.cat == null ? "" : CAT[a.cat].path;
  }
  return Object.values(agg);
}

const BANK_TYPE_LABEL = [[/RETURN/, "возврат"], [/^CARD-PAYMENT/, "оплата картой"], [/^MOBILE-PAYMENT-POS/, "BLIK-платёж"],
  [/^MOBILE-PAYMENT-C2C/, "BLIK на телефон"], [/^CARD-ATM/, "снятие в банкомате"], [/^CASH-IN/, "взнос наличных"],
  [/^US-TRANSFER/, "перевод в налоговую"], [/TRANSFER/, "перевод"], [/FEE/, "комиссия банка"], [/^INTEREST/, "проценты"]];
const bankType = tp => (BANK_TYPE_LABEL.find(([re]) => re.test(tp || "")) || [null, tp || ""])[1];
const ddmmyy = d => `${d.slice(8, 10)}.${d.slice(5, 7)}.${d.slice(2, 4)}`;
let DAYIDX = null, DAYIDX_D = null;
function nearby(p) {  // покупки за этот и два предыдущих дня: банк списывает BLIK и карту с задержкой
  if (DAYIDX_D !== D) { DAYIDX = {}; DAYIDX_D = D; for (const q of D.purchases) (DAYIDX[q.date.slice(0, 10)] ??= []).push(q); }
  const d0 = new Date(p.date.slice(0, 10) + "T12:00:00"), out = [];
  for (let k = 0; k <= 2; k++) {
    const d = new Date(d0 - k * 864e5).toISOString().slice(0, 10);
    for (const q of DAYIDX[d] || []) if (q.source !== "bank" && q.items.some(isExp)) out.push(q);  // чеки и заказы
  }
  return out.length ? out.slice(0, 6).map(q => `<div class="muted" style="white-space:nowrap">${ddmmyy(q.date)} ${esc(q.merchant.slice(0, 24))}
      ${zl(q.total)}</div>`).join("") + (out.length > 6 ? `<div class="muted">… ещё ${out.length - 6}</div>` : "")
    : `<span class="muted">чеков и заказов нет</span>`;
}
function occRow(a, cols) {
  const occ = a.occ.slice().sort((x, y) => x.p.date < y.p.date ? 1 : -1);
  const anyBank = occ.some(o => o.p.source === "bank");
  return `<tr class="occ${a.name.toLowerCase() === S.justOpened ? " fresh" : ""}"><td colspan="${cols}"><table class="occt"><tr><th>дата</th><th>где / откуда</th><th>операция в банке</th>
      ${anyBank ? `<th>чеки и заказы в эти дни</th>` : ""}<th>категория</th><th class="n">сумма</th></tr>` +
    occ.map(({p, it}) => {
      const b = p.bank, time = p.date.slice(11, 16);
      // у операций без чека «магазин» и «точка» — это и есть описание из выписки: не повторяем
      const fromBank = p.source === "bank", where = fromBank && /^[\d\s]+$/.test(p.merchant) ? "магазин не указан" : p.merchant;
      return `<tr class="${PENDING.has(`item|${p.id}|${it.line}`) ? "pending" : ""}">
        <td style="white-space:nowrap">${ddmmyy(p.date)}${time && time !== "12:00" ? ` <span class="muted">${time}</span>` : ""}${delBtn(p)}</td>
        <td><div class="who">${ava(where)}<div>${esc(where)}${p.store && !fromBank ? `<div class="muted">${esc(p.store)}</div>` : ""}
          <div class="muted">${esc(SOURCES[p.source] || p.source)} · ${esc(D.payments[p.pay ?? "unknown"] || p.pay || "")}${p.card ? " •" + esc(p.card) : ""}${
            p.file ? ` · <a href="/file/${esc(p.file)}" target="_blank">${p.source === "email" ? "✉ письмо" : "📷 фото"}</a>` : ""}${photoLinks(p)}${
            (p.n_items || p.items.length) > 1 ? ` · в чеке ${p.n_items || p.items.length} поз. на ${zl(p.total)}` : ""}</div>${noteHtml(it)}
          ${p.note ? `<div class="warn" style="font-size:.8em">${esc(p.note)}</div>` : ""}</div></div></td>
        <td>${b ? `${esc(bankType(b.type))}<div class="muted">${esc([b.who, b.desc].filter(Boolean).join(" · "))}</div>${
            b.date !== p.date.slice(0, 10) ? `<div class="muted">списано ${ddmmyy(b.date)}</div>` : ""}`
          : `<span class="muted">${p.pay === "cash" ? "наличные" : "нет в выписке PKO"}</span>`}</td>
        ${anyBank ? `<td>${p.source === "bank" ? nearby(p) : ""}</td>` : ""}
        <td style="white-space:nowrap">${catPick(it.cat, "item", {name: it.name, pid: p.id, line: it.line})}${noteBtn(p.id, it)}</td>
        <td class="n">${zl(net(it))}</td></tr>`;
    }).join("") + `</table></td></tr>`;
}

let CATS_RS = null, CATS_BRANCHES = [];
function catsTable(rs) {  // категория -> подкатегории -> товары; каждая ветка разворачивается
  CATS_RS = rs;
  const T = {}, roots = new Set(); let all = 0;
  const node = k => (T[k] ??= {spent: 0, items: [], kids: new Set()});
  for (const r of rs) for (const it of r.items) {
    const v = net(it); all += v;
    let k = it.cat == null || !CAT[it.cat] ? "none" : String(it.cat);
    node(k).items.push({r, it});
    for (;;) {
      node(k).spent += v;
      const par = k === "none" ? null : CAT[k].parent_id;
      if (par == null) { roots.add(k); break; }
      node(String(par)).kids.add(k); k = String(par);
    }
  }
  CATS_BRANCHES = Object.keys(T).filter(k => T[k].kids.size);
  const name = k => k === "none" ? "⚠ Неопознанные" : CAT[k] ? CAT[k].name : "?";
  const bar = v => `<div class="bar" style="width:${(v / (all || 1) * 100).toFixed(1)}%"></div>`;
  const bySpent = (a, b) => T[b].spent - T[a].spent;
  const rows = (k, depth, fresh) => {
    const n = T[k], open = S.openCats.has(k), kids = [...n.kids].sort(bySpent);
    const label = depth ? esc(name(k)) : `<b>${esc(name(k))}</b>`;
    let h = `<tr class="crow${open ? " opened" : ""}${fresh ? " fresh" : ""}"><td style="padding-left:${12 + depth * 26}px">
        <button class="cellbtn ctog" data-cattog="${k}" title="${open ? "свернуть" : "развернуть"}"><span class="chev${open ? " on" : ""}"></span>${label}</button>
        ${kids.length ? "" : `<span class="src">${n.items.length} поз.</span>`}</td>
      <td class="n">${depth ? zl(n.spent) : `<b>${zl(n.spent)}</b>`}</td><td class="n">${(n.spent / (all || 1) * 100).toFixed(0)}%</td>
      <td>${bar(n.spent)}</td></tr>`;
    if (!open) return h;
    const fr = S.justOpenedCat === k;
    h += kids.map(c => rows(c, depth + 1, fr)).join("");
    if (n.items.length) {  // позиции прямо в этой категории: таблица товаров с правкой категории и раскрытием случаев
      const agg = aggregate(n.items.map(({r, it}) => ({...r, items: [it], n_items: r.items.length})));
      h += `<tr class="occ${fr ? " fresh" : ""}"><td colspan="4" style="padding-left:${26 + depth * 26}px">
        ${kids.length ? `<div class="muted" style="margin:2px 0 4px">прямо в «${esc(name(k))}», без подкатегории</div>` : ""}${itemsTable(agg)}</td></tr>`;
    }
    return h;
  };
  return `<div class="cattools"><button class="chip" data-catall="1">развернуть всё</button>
      <button class="chip" data-catall="0">свернуть всё</button></div>
    <table class="cats"><tr><th>категория</th><th class="n">потрачено</th><th class="n">доля</th><th style="width:35%"></th></tr>` +
    [...roots].sort(bySpent).map(k => rows(k, 0, false)).join("") + "</table>";
}

function receiptsList(rs) {
  return rs.map(r => `<details ${r.items.some(it => PENDING.has(`item|${r.id}|${it.line}`)) ? "open" : ""}><summary>${ava(r.merchant)}<b>${r.date.slice(8, 10)}.${r.date.slice(5, 7)}.${r.date.slice(2, 4)} ${r.date.slice(11, 16)}</b>
      · ${zl(r.value)}${r.saved ? ` · <span class="save">скидки −${zl(r.saved)}</span>` : ""}
      · ${r.items.length} поз. · ${esc(D.payments[r.pay ?? "unknown"])}${r.card ? " •" + esc(r.card) : ""}
      <span class="muted">${esc(r.merchant)} · ${esc(r.store)}</span>
      ${r.file ? ` · <a href="/file/${esc(r.file)}" target="_blank">${r.source === "email" ? "✉ письмо" : "📷 фото"}</a>` : ""}${photoLinks(r)}
      ${r.note ? ` · <span class="warn">${esc(r.note)}</span>` : ""}${delBtn(r)}</summary>
    <table><tr><th>товар</th><th>категория</th><th class="n">кол-во</th><th class="n">цена</th><th class="n">сумма</th><th class="n">скидка</th></tr>` +
    r.items.map(it => `<tr><td>${esc(it.name)}${noteHtml(it)}</td>
      <td>${catPick(it.cat, "item", {name: it.name, pid: r.id, line: it.line})}${noteBtn(r.id, it)}
        <span class="src">${SRC_LABEL[it.cat_src] || ""}</span></td>
      <td class="n">${+(it.qty || 1).toFixed(3)}</td><td class="n">${it.unit_price != null ? zl(it.unit_price) : ""}</td>
      <td class="n">${zl(it.amount)}</td><td class="n save">${it.discount ? "−" + zl(it.discount) : ""}</td></tr>`).join("") +
    "</table></details>").join("");
}

// ---------- неопознанные
function renderUnknown() {
  const items = aggregate(filtered()).filter(a => a.cat == null || a.mixed && a.cats[""]);
  document.getElementById("main").innerHTML = items.length
    ? `<h2>Неопознанные позиции: ${items.length}</h2>
       <p class="muted">Выбери категорию — она применится ко всем таким позициям и запомнится для будущих чеков.
         Нажми на название — увидишь каждый случай: дату, где, операцию в банке и что ещё покупалось в эти дни.

      itemsTable(items, ["где", a => esc([...a.merchants].join(", "))])
    : `<div class="empty">Неопознанных позиций нет 🎉</div>`;

// ---------- категории
function renderCategories() {
  const ps = filtered(), spent = {}, count = {};
  for (const p of ps) for (const it of p.items) {
    let c = it.cat;
    while (c != null) { spent[c] = (spent[c] || 0) + net(it); count[c] = (count[c] || 0) + 1; c = CAT[c].parent_id; }
  }
  const byName = (a, b) => a.name.localeCompare(b.name, "ru");
  const row = (c, depth, fresh = false) => {
    const kids = (KIDS[c.id] || []).slice().sort(byName), open = S.openCatPage.has(c.id);
    const label = depth ? esc(c.name) : `<b>${esc(c.name)}</b>`;
    return `<tr class="${fresh ? "fresh" : ""}${open ? " opened" : ""}"><td style="padding-left:${10 + depth * 26}px">
      ${kids.length ? `<button class="cellbtn ctog" data-cpt="${c.id}" title="${open ? "свернуть" : "развернуть"}"><span class="chev${open ? " on" : ""}"></span>${label}</button>
        <span class="src">${kids.length} подкат.</span>` : `<span class="chev none"></span>${label}`}
      ${c.kind !== "expense" ? `<span class="src">${c.kind === "income" ? "доход" : "не расход"}</span>` : ""}</td>
      <td class="n">${count[c.id] || ""}</td><td class="n">${spent[c.id] ? zl(spent[c.id]) : ""}</td>
      <td style="white-space:nowrap"><button class="chip act" data-addcat="${c.id}">+ подкатегория</button>
        <button class="chip act" data-rencat="${c.id}">переименовать</button>
        ${catPick(null, "move", {id: c.id}).replace("⚠ неопознанные ▾", "перенести ▾").replace("catpick", "catpick chip act")}
        <button class="chip act" data-delcat="${c.id}">удалить</button></td></tr>` +
      (open ? kids.map(k => row(k, depth + 1, S.justOpenedCatPage === c.id)).join("") : ""); };
  document.getElementById("main").innerHTML = `
    <h2>Категории</h2>
    <div class="cattools"><button class="chip" data-addcat="">+ новая категория верхнего уровня</button>
      <button class="chip" data-cptall="1">развернуть всё</button><button class="chip" data-cptall="0">свернуть всё</button></div>
    <table class="tree"><tr><th>категория</th><th class="n">позиций</th><th class="n">потрачено</th><th></th></tr>
      ${(KIDS[0] || []).slice().sort((a, b) => (a.kind !== "expense") - (b.kind !== "expense") || byName(a, b)).map(c => row(c, 0)).join("")}</table>
    <p class="muted">Удаление: позиции, правила и подкатегории переходят в родительскую категорию.
      Переименование и перенос не ломают правила — старые названия запоминаются.</p>
    <h2>Правила (${D.rules.length})</h2>
    <p class="muted">Создаются при выборе категории «для всех таких». Удалишь правило — позиции вернутся к словарю.</p>
    ${D.rules.length ? `<table><tr><th>условие</th><th>категория</th><th>создано</th><th></th></tr>` + D.rules.map(r => `<tr>
      <td>${r.product_code ? "код товара " + esc(r.product_code) : "название «" + esc(humanPattern(r.pattern)) + "»"}</td>
      <td>${esc(r.path)}</td><td>${esc(r.created)}</td>
      <td><button class="chip" data-delrule="${r.id}">удалить</button></td></tr>`).join("") + "</table>" : `<p class="muted">Правил пока нет.</p>`}`;
}

// ---------- банк: баланс, доходы и расходы, покрытие чеками, наличные
let BANK = null, bankCharts = [];
async function renderBank() {
  const main = document.getElementById("main");
  if (!BANK) BANK = await (await fetch("/api/bank")).json();
  if (BANK.empty || !Object.keys(BANK.balance).length) {
    main.innerHTML = `<div class="empty">Выписка ещё не загружена. Подключить банк: python budget.py bank login, затем python budget.py bank sync (см. README)</div>`; return;
  }
  bankCharts.forEach(c => c.destroy()); bankCharts = [];
  const F = S.F, inRange = m => (!F.from || m >= F.from) && (!F.to || m <= F.to);
  const days = Object.keys(BANK.balance).sort().filter(d => inRange(d.slice(0, 7)));
  const months = [...new Set([...Object.keys(BANK.months), ...Object.keys(BANK.income)])].sort()
    .filter(m => inRange(m) && m >= Object.keys(BANK.balance).sort()[0].slice(0, 7));
  // доход: категории «Доходы/…» и ещё не размеченные поступления (так же считает список операций ниже)
  const inc = m => Object.entries(BANK.income[m] || {}).filter(([k]) => k.startsWith("Доходы") || k === "Прочие поступления")
    .reduce((s, [, v]) => s + v, 0);
  const mm = m => BANK.months[m] || {};
  const pko = m => (mm(m).receipts || 0) + (mm(m).bank_only || 0);
  const spent = m => pko(m) + (mm(m).cash || 0) + (mm(m).other || 0);
  const lastBal = BANK.balance[Object.keys(BANK.balance).sort().pop()];
  const totInc = months.reduce((s, m) => s + inc(m), 0), totSp = months.reduce((s, m) => s + spent(m), 0);
  const rec = months.reduce((s, m) => s + (mm(m).receipts || 0), 0), pkoSp = months.reduce((s, m) => s + pko(m), 0);
  const other = months.reduce((s, m) => s + (mm(m).other || 0), 0);
  const shopRec = months.reduce((s, m) => s + (mm(m).shop_receipts || 0), 0);
  const shopAll = shopRec + months.reduce((s, m) => s + (mm(m).shop_bank_only || 0), 0);
  const atm = months.reduce((s, m) => s + (mm(m).atm || 0), 0), cash = months.reduce((s, m) => s + (mm(m).cash || 0), 0);
  const incCats = {};
  for (const m of months) for (const [k, v] of Object.entries(BANK.income[m] || {})) incCats[k] = (incCats[k] || 0) + v;
  main.innerHTML = `
    <div class="cards">
      <div class="card">остаток на счёте<b>${zl(lastBal)}</b>на ${esc(BANK.last || "")}</div>
      <div class="card">доходы за период<b class="save">${zl(totInc)}</b>в месяц ${zl(totInc / (months.length || 1))}</div>
      <div class="card">расходы со счёта PKO<b>${zl(pkoSp)}</b>в месяц ${zl(pkoSp / (months.length || 1))}</div>
      <div class="card">трат PKO подтверждено чеками<b>${(rec / (pkoSp || 1) * 100).toFixed(0)}%</b>с арендой, учёбой, налогами</div>
      <div class="card">покупок подтверждено чеками<b>${(shopRec / (shopAll || 1) * 100).toFixed(0)}%</b>без аренды, учёбы, налогов, комиссий</div>
      <div class="card">другой картой/счётом<b>${zl(other)}</b>по чекам, в выписке PKO их нет</div>
      <div class="card">наличные<b>${zl(atm)}</b>снято; в чеках за наличные ${zl(cash)}</div>
      <div class="card">доступ к банку<b>${BANK.valid_until ? BANK.valid_until.slice(0, 10) : "—"}</b>потом: bank login</div>
    </div>
    <h2>Баланс</h2><div class="chartbox"><canvas id="bal" height="90"></canvas></div>
    <h2>Доходы и расходы по месяцам</h2>
    <p class="muted">Легенда включает и выключает виды. Клик по столбцу графика или по сумме в таблице — ниже откроются
      операции, из которых она сложилась.</p>
    <div class="chartbox"><canvas id="flow" height="110"></canvas></div>

      <th class="n">только выписка</th><th class="n">другой картой</th><th class="n">наличными (чеки)</th><th class="n">снято в банкомате</th>
      <th class="n">доходы − расходы PKO</th></tr>` +
    months.slice().reverse().map(m => `<tr data-row="${m}"><td><button class="cellbtn" data-bcell="all" data-bm="${m}"

      ${cellBtn(m, "receipts", mm(m).receipts)}${cellBtn(m, "bank_only", mm(m).bank_only)}${cellBtn(m, "other", mm(m).other)}
      ${cellBtn(m, "cash", mm(m).cash)}${cellBtn(m, "atm", mm(m).atm)}

      разметить на странице «Неопознанные» или в обзоре (источник «банк»).</p>`;

      fill: {target: "origin", above: alpha(css("--c-blue"), .12), below: alpha(css("--c-red"), .18)}}]},
    options: {animation: chartAnim(), interaction: {mode: "index", intersect: false}, plugins: {legend: {display: false}},
      scales: {x: {grid: {display: false}, ticks: {maxTicksLimit: 14}}}}}));

      {label: "доходы", data: months.map(inc), backgroundColor: css("--c-green"), stack: "in"},
      {label: "по чекам", data: months.map(m => mm(m).receipts || 0), backgroundColor: css("--c-blue"), stack: "out"},
      {label: "наличными (чеки)", data: months.map(m => mm(m).cash || 0), backgroundColor: css("--c-violet"), stack: "out"},

      {label: "переводы и банкомат", data: months.map(m => flows(m).transfers), backgroundColor: css("--c-gray2"), stack: "tr",

    options: {animation: chartAnim(), plugins: {legend: {position: "bottom", onClick: (e, item, legend) => {
        const ch = legend.chart, i = item.datasetIndex, key = BANK_TYPES[i].key;
        ch.isDatasetVisible(i) ? (ch.hide(i), S.bankShow.delete(key)) : (ch.show(i), S.bankShow.add(key));
        S.bankCell = null; drawBankList();
      }}}, scales: {x: {stacked: true, grid: {display: false}}, y: {stacked: true}},
      onClick: (e, els) => { if (els.length) { const m = months[els[0].index];
        S.bankMonth = S.bankMonth === m && !S.bankCell ? null : m; S.bankCell = null; drawBankList();
        document.getElementById("banklist").scrollIntoView({behavior: "smooth"}); } }}}));

const BANK_TYPES = [
  {key: "income", label: "доход", color: "--c-green"}, {key: "receipts", label: "по чекам", color: "--c-blue"},
  {key: "cash", label: "наличными (чек)", color: "--c-violet"}, {key: "bank_only", label: "только выписка", color: "--c-orange"},
  {key: "other", label: "другой картой", color: "--c-gray"}, {key: "transfers", label: "перевод / банкомат", color: "--text-2"},
  {key: "atm", label: "банкомат", color: "--text-2"}];  // atm — только для подписи в списке, своего столбца на графике нет
// ячейки таблицы по месяцам: какие виды операций в них входят
const BANK_CELLS = {
  income: {label: "доходы", kinds: ["income"]}, pko: {label: "расходы PKO", kinds: ["receipts", "bank_only"]},
  receipts: {label: "расходы по чекам", kinds: ["receipts"]}, bank_only: {label: "только выписка", kinds: ["bank_only"]},
  other: {label: "другой картой", kinds: ["other"]}, cash: {label: "наличными (чеки)", kinds: ["cash"]},
  atm: {label: "снято в банкомате", kinds: ["atm"]},
  net: {label: "доходы − расходы PKO", kinds: ["income", "receipts", "bank_only"], net: true}};

  `<td class="n ${cls}"><button class="cellbtn" data-bcell="${key}" data-bm="${m}" title="показать операции">${zl(v)}</button></td>`;
S.bankShow = new Set(["income", "receipts", "cash", "bank_only", "other"]);
S.bankMonth = null; S.bankCell = null;
const isExp = it => !(it.cat != null && CAT[it.cat] && CAT[it.cat].kind !== "expense");
const isAtm = it => it.cat != null && CAT[it.cat] && CAT[it.cat].path === "Переводы/Снятие наличных";
const kindOf = r => r.atm ? "atm" : r.type;
function bankRows() {
  const rows = [];
  for (const p of D.purchases) {
    const exp = p.items.filter(isExp), tr = p.items.filter(it => !isExp(it));
    const type = p.source === "bank" ? "bank_only" : p.pay === "cash" ? "cash" : p.bt ? "receipts" : "other";
    if (exp.length) rows.push({type, date: p.date, p, items: exp, amount: exp.reduce((s, it) => s + net(it), 0)});
    for (const [atm, part] of [[true, tr.filter(isAtm)], [false, tr.filter(it => !isAtm(it))]])
      if (part.length) rows.push({type: "transfers", atm, date: p.date, p, items: part, amount: part.reduce((s, it) => s + net(it), 0)});
  }
  for (const x of BANK.incomes || []) {
    const k = x.cat != null && CAT[x.cat] ? CAT[x.cat].kind : "income";
    rows.push({type: k === "transfer" ? "transfers" : "income", date: x.date, inc: x, amount: x.amount});
  }
  return rows;
}
function flows(m) {  // переводы и банкомат за месяц (для графика)
  return {transfers: bankRows().filter(r => r.type === "transfers" && r.date.startsWith(m)).reduce((s, r) => s + r.amount, 0)};
}

let DEALS = null, DSEARCH = null, DINFL = null, DHIST = null, dCharts = [];
const ddmm = d => d ? `${d.slice(8, 10)}.${d.slice(5, 7)}` : "";
// слова названия: «PrimoSkyrNaturalny150g» -> primo skyr naturalny 150g (как в словаре категорий)
const nameWords = s => foldTxt(String(s).replace(/([a-ząćęłńóśźż])([A-ZĄĆĘŁŃÓŚŹŻ])/g, "$1 $2")).split(/[^a-z0-9а-я]+/).filter(Boolean);
const wordHit = (w, tok) => { const st = tok.length >= 4 && /[aeiouy]$/.test(tok) ? tok.slice(0, -1) : tok;
                              return w.startsWith(st) && w.length - st.length <= 3; };
function mine(q) {  // этот товар в твоих чеках: сколько раз, почём обычно
  const toks = foldTxt(q).split(/\s+/).filter(x => x.length > 2);
  if (!toks.length) return null;
  const hits = [];
  for (const p of D.purchases) for (const it of p.items) {
    const ws = nameWords(it.name);
    if (toks.every(tk => ws.some(w => wordHit(w, tk)))) hits.push({date: p.date, merchant: p.merchant, qty: it.qty || 1, price: net(it) / (it.qty || 1)});
  }
  if (!hits.length) return null;
  hits.sort((a, b) => a.date < b.date ? -1 : 1);
  const last = hits[hits.length - 1], pcs = hits.every(h => Number.isInteger(h.qty));
  return {n: hits.length, last, avg: hits.reduce((s, h) => s + h.price, 0) / hits.length, pcs};
}
const mineText = m => m ? `<span class="muted">· ты покупал ${m.n} раз, последний ${ddmmyy(m.last.date)} по ${zl(m.last.price)}

  </div>`;
}

const UST = {ok: ["✓", "--green", "готово"], warn: ["!", "--orange", "внимание"], off: ["!", "--orange", "не настроено"],
             skip: ["–", "--text-2", "пропущено"], error: ["✗", "--red", "ошибка"], running: ["…", "--accent", "идёт"]};
const TRIG = {manual: "из терминала", schedule: "автозапуск", ui: "из интерфейса"};
const stBadge = st => { const [m, c, txt] = UST[st] || UST.running; return `<span class="st" style="--c:var(${c})">${m} ${txt}</span>`; };

const dur = (a, b) => { if (!a || !b) return ""; const s = Math.round((new Date(b) - new Date(a)) / 1000);

const cmd = c => c ? (/^python /.test(c) ? `<code data-copy="${esc(c)}" title="нажми, чтобы скопировать">${esc(c)}</code>` : esc(c)) : "";

async function startUpdate(steps) {
  const before = UPD && UPD.runs.length ? UPD.runs[0].id : (D.meta.update_last ? D.meta.update_last.id : 0);
  try { await post("/api/update/run", {steps}); } catch (e) { toast("Не запустилось: " + e.message); return; }
  UPD_WAIT = {before, since: Date.now()};
  toast(steps.length ? "Обновляю источник…" : "Обновление запущено");
  if (S.page === "settings") drawSettings();
  pollUpdate();
}
async function pollUpdate() {
  clearTimeout(updTimer);
  UPD = await (await fetch("/api/update")).json();
  const r = UPD.runs[0], started = r && r.id > UPD_WAIT.before, done = started && r.finished;
  if (!done && (started || UPD.running || Date.now() - UPD_WAIT.since < 30000)) {
    if (S.page === "settings") drawSettings();
    updTimer = setTimeout(pollUpdate, 2000);
    return;
  }
  UPD_WAIT = null;
  if (!started) toast("Обновление не запустилось — попробуй в терминале: python budget.py update");
  else toast(r.status === "ok" ? "Обновление завершено без ошибок" : "Обновление завершено: " + r.summary);
  BANK = null; WALLET = null;
  const y = scrollY; await load(); scrollTo(0, y);
}

function toast(msg, o = {}) {  // o.action + o.onAction — кнопка «Вернуть» с обратным отсчётом, как в Telegram; o.spin — идёт работа
  const t = document.getElementById("toast"), ms = o.ms || (o.action ? 7000 : 2600);
  clearInterval(t._cd);
  t.innerHTML = (o.spin ? `<span class="spin"></span>` : "") +
    (o.action ? `<span class="cd"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" style="animation-duration:${ms}ms"/></svg><b>${Math.round(ms / 1000)}</b></span>` : "") +
    `<span>${esc(msg)}</span>` + (o.action ? `<button class="tact" type="button">${esc(o.action)}</button>` : "");
  t.classList.toggle("act", !!o.action);
  if (o.action) {
    const end = Date.now() + ms;
    t._cd = setInterval(() => { const b = t.querySelector(".cd b"); if (b) b.textContent = Math.max(0, Math.ceil((end - Date.now()) / 1000)); }, 250);
    t.querySelector(".tact").onclick = () => { t.classList.remove("show"); clearInterval(t._cd); o.onAction(); };
  }
  t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(() => { t.classList.remove("show"); clearInterval(t._cd); }, ms);
}

async function post(url, body) {
  const r = await fetch(url, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
  const j = await r.json();
  if (!r.ok || !j.ok) throw new Error(j.error || r.statusText);
  return j;
}

  if (e.target.closest("#picker, #modal, #toast")) return;
  const cp = e.target.closest("code[data-copy]");
  if (cp) { navigator.clipboard.writeText(cp.dataset.copy).then(() => toast("Скопировано: " + cp.dataset.copy)); return; }
  const pick = e.target.closest(".catpick");
  if (pick) { e.preventDefault(); openPicker(pick); return; }
  if (PICK) closePicker();
  const t = e.target.closest("button, th");
  if (!t) { hidePopup(e); return; }
  if (t.id === "savebtn") { await saveAll(); return; }
  if (t.id === "themebtn") { toggleTheme(e); return; }
  if (t.dataset.hide) { e.preventDefault(); await hidePurchase(t.dataset.hide); return; }
  if (t.dataset.cpt) {
    const id = +t.dataset.cpt; S.openCatPage.has(id) ? S.openCatPage.delete(id) : S.openCatPage.add(id);
    S.justOpenedCatPage = S.openCatPage.has(id) ? id : null; renderCategories(); S.justOpenedCatPage = null; return;
  }
  if (t.dataset.cptall) {
    S.openCatPage = t.dataset.cptall === "1" ? new Set(Object.values(CAT).filter(c => (KIDS[c.id] || []).length).map(c => c.id)) : new Set();
    renderCategories(); return;
  }
  if (t.dataset.dupdate) {
    const j = await dealsAction(() => post("/api/deals/update", {}), "Скачиваю свежие газетки Lidl…");
    if (j) { await refreshDeals(); toast(`Газетки обновлены: ${j.flyers}`); }
    return;
  }
  if (t.dataset.wadd || t.dataset.waddQ) {
    const inp = document.getElementById("wq"), q = (t.dataset.waddQ || (inp && inp.value) || "").trim();
    if (!q) { inp && inp.focus(); return; }
    if (await dealsAction(() => post("/api/deals/watch", {action: "add", q}))) { await refreshDeals(); drawDealSearch(); toast(`«${q}» — в постоянных позициях`); }
    return;
  }
  if (t.dataset.wrm) {
    const q = t.dataset.wrm;
    if (await dealsAction(() => post("/api/deals/watch", {action: "remove", q}))) {
      await refreshDeals();
      toast(`«${q}» убран из постоянных`, {action: "Вернуть", onAction: async () => { await post("/api/deals/watch", {action: "add", q}); await refreshDeals(); }});
    }
    return;
  }
  if (t.dataset.dsearch) { await dealSearch(); return; }
  if (t.dataset.rat) {
    const v = document.getElementById("rat").value;
    const j = await dealsAction(() => post("/api/deals/settings", {remind_at: v}));
    if (j) { DEALS.telegram = j.telegram;
             toast(`Новые напоминания — накануне в ${j.telegram.remind_at}. Уже поставленные остаются на прежнее время`, {ms: 5000}); }
    return;
  }
  if (t.dataset.wtime) {
    const v = await promptBox({title: "Во сколько это было?", value: t.dataset.wcur || "", placeholder: "ЧЧ:ММ, например 20:15",
      text: `${t.dataset.wday}: банк сообщает только дату. Укажи время, чтобы операция встала до или после твоего пересчёта. Пусто — снова по выписке.`,
      ok: "Сохранить"});
    if (v === null) return;
    const hm = v.trim().replace(".", ":");
    if (hm && !/^([01]?\d|2[0-3]):[0-5]\d$/.test(hm)) { toast("Время в формате ЧЧ:ММ"); return; }
    await post("/api/wallet/time", {tx: t.dataset.wtime, at: hm ? `${t.dataset.wday}T${hm.padStart(5, "0")}` : null});
    WALLET = null; BANK = null; const y = scrollY; await load(); scrollTo(0, y);
    toast(hm ? `Время операции: ${hm}` : "Время — снова по выписке"); return;
  }
  if (t.dataset.dhist) { await dealHistory(); return; }
  if (t.dataset.remind) {
    const j = await dealsAction(() => post("/api/deals/remind", {q: t.dataset.q, keys: [t.dataset.remind]}), "Ставлю напоминание в Telegram…");
    if (j) {
      const r = j.made[0];
      toast(!r ? "Акция не найдена — обнови газетки" : r.skipped ? "Напоминание уже стояло" : `Напоминание в Избранном: ${r.when}`);
      DEALS = null; DSEARCH = DSEARCH && {...DSEARCH, deals: (await (await fetch("/api/deals/search?q=" + encodeURIComponent(DSEARCH.q))).json()).deals};
      const y = scrollY; await renderDeals(); scrollTo(0, y);
    }
    return;
  }  // preventDefault: не сворачивать чек
  if (t.dataset.restore) { await restorePurchase(t.dataset.restore); return; }
  if (t.dataset.notePid) { await editNote(t.dataset); return; }
  if (t.dataset.cattog) {
    const k = t.dataset.cattog;
    S.openCats.has(k) ? S.openCats.delete(k) : S.openCats.add(k);
    S.justOpenedCat = S.openCats.has(k) ? k : null;
    document.getElementById("body").innerHTML = catsTable(CATS_RS); S.justOpenedCat = null; return;
  }
  if (t.dataset.catall) {
    S.openCats = t.dataset.catall === "1" ? new Set(CATS_BRANCHES) : new Set();
    document.getElementById("body").innerHTML = catsTable(CATS_RS); return;
  }
  if (t.dataset.bankall) { S.bankMonth = null; S.bankCell = null; drawBankList(); return; }
  if (t.dataset.bcell) {
    const cell = t.dataset.bcell === "all" ? null : t.dataset.bcell;
    if (S.bankMonth === t.dataset.bm && S.bankCell === cell) { S.bankMonth = null; S.bankCell = null; drawBankList(); return; }
    S.bankMonth = t.dataset.bm; S.bankCell = cell; drawBankList();
    document.getElementById("banklist").scrollIntoView({behavior: "smooth"}); return;
  }
  if (t.dataset.bankcellReset) { S.bankCell = null; drawBankList(); return; }
  if (t.dataset.occ !== undefined) {
    const k = t.dataset.occ; S.openOcc.has(k) ? S.openOcc.delete(k) : S.openOcc.add(k);
    S.justOpened = S.openOcc.has(k) ? k : null;
    const y = scrollY; render(); scrollTo(0, y); S.justOpened = null; return;
  }
  if (t.dataset.updrun !== undefined) { await startUpdate(t.dataset.updrun ? [t.dataset.updrun] : []); return; }
  if (t.dataset.sched) { await setSchedule(t.dataset.sched === "on"); return; }
  if (t.dataset.monthOpen) { S.page = "overview"; S.month = t.dataset.monthOpen; render(); scrollTo(0, 0); return; }
  if (t.id === "cancelbtn") { PENDING.clear(); updateSavebar(); render(); return; }
  if (t.dataset.page) {
    S.page = t.dataset.page; S.anim = true;
    if (S.page === "settings" && !UPD_WAIT) { UPD = null; SCHED = null; }
    render(); scrollTo(0, 0);
  }
  else if (t.dataset.month) { S.month = t.dataset.month; CHART_ANIM = false; renderOverview(); animateEnter(document.getElementById("panel")); }
  else if (t.dataset.view) { S.view = t.dataset.view; CHART_ANIM = false; renderOverview(); animateEnter(document.getElementById("body")); }
  else if (t.dataset.sort) {
    const k = t.dataset.sort;
    S.sort = {key: k, dir: S.sort.key === k ? -S.sort.dir : (k === "name" || k === "catName" ? 1 : -1)};
    render();
  }
  else if (t.dataset.pay) { S.F.pay.has(t.dataset.pay) ? S.F.pay.delete(t.dataset.pay) : S.F.pay.add(t.dataset.pay); render(); }
  else if (t.id === "reset") {
    S.F = {from: "", to: "", pay: new Set(), merchant: "", cat: "", source: "", q: ""};
    document.getElementById("q").value = ""; render();
  }
  else if ("addcat" in t.dataset) {
    const parent = t.dataset.addcat ? +t.dataset.addcat : null;
    const name = await promptBox({title: parent ? "Новая подкатегория" : "Новая категория",
                                  text: parent ? `Внутри «${CAT[parent].path.replaceAll("/", " › ")}»` : "", ok: "Добавить"});
    if (name) { await post("/api/add-category", {name, parent_id: parent}); if (parent) S.openCatPage.add(parent);
                toast("Категория добавлена"); await load(); }
  }
  else if (t.dataset.rencat) {
    const c = CAT[t.dataset.rencat];
    const name = await promptBox({title: "Переименовать категорию", text: c.path.replaceAll("/", " › "), value: c.name, ok: "Сохранить"});
    if (name && name !== c.name) { await post("/api/category/rename", {id: c.id, name}); toast("Переименовано"); await load(); }
  }
  else if (t.dataset.delcat) {
    const c = CAT[t.dataset.delcat];
    if (await confirmBox({title: "Удалить категорию?", ok: "Удалить", danger: true,
        text: `«${c.path}». Позиции и подкатегории перейдут в «${c.parent_id ? CAT[c.parent_id].path : "неопознанные / верхний уровень"}».`})) {
      await post("/api/category/delete", {id: c.id}); toast("Категория удалена"); await load();
    }
  }
  else if (t.dataset.wdel) {
    if (await confirmBox({title: "Удалить запись о наличных?", text: "Остаток пересчитается.", ok: "Удалить", danger: true})) { await post("/api/wallet/delete", {id: +t.dataset.wdel}); WALLET = null; BANK = null; await load(); }
  }
  else if (t.id === "wsave") { await walletSave(); }
  else if (t.dataset.delrule) { await post("/api/delete-rule", {id: +t.dataset.delrule}); toast("Правило удалено"); await load(); }
  else if (t.dataset.choice) { await applyChoice(t.dataset.choice); }
  else hidePopup(e);
});

document.addEventListener("change", async e => {
  const t = e.target;
  if (t.dataset.f) { S.F[t.dataset.f] = t.value; render(); return; }
  if (t.dataset.only) { const p = PENDING.get(t.dataset.only); if (p) p.mode = t.checked ? "item" : "same"; }
});

let pending = null;
function showPopup(sel, cat) {
  pending = {sel, cat};
  const p = document.getElementById("popup"), r = sel.getBoundingClientRect();
  p.innerHTML = `<div class="muted">«${esc(sel.dataset.name)}» → ${cat == null ? "неопознанные" : esc(CAT[cat].path)}</div>
    <button data-choice="same">для всех таких позиций (и запомнить)</button>
    <button data-choice="item">только для этой позиции</button>
    <button data-choice="cancel">отмена</button>`;
  p.style.left = (r.left + scrollX) + "px"; p.style.top = (r.bottom + scrollY + 4) + "px"; p.style.display = "block";
}
function hidePopup(e) {
  const p = document.getElementById("popup");
  if (p.style.display === "block" && !(e && p.contains(e.target))) { p.style.display = "none"; if (pending) { pending = null; render(); } }
}
async function applyChoice(choice) {
  const {sel, cat} = pending; pending = null;
  document.getElementById("popup").style.display = "none";
  if (choice === "cancel") { render(); return; }
  if (choice === "same") await setCategory({mode: "same", name: sel.dataset.name, category_id: cat});
  else await setCategory({mode: "item", purchase_id: sel.dataset.pid, line: +sel.dataset.line, category_id: cat});
}

async function dealSearch() {
  const q = (document.getElementById("dq") || {}).value?.trim();
  if (!q) return;
  DSEARCH = await (await fetch("/api/deals/search?q=" + encodeURIComponent(q))).json();
  drawDealSearch(); animateEnter(document.getElementById("dres"));
}
async function dealHistory() {
  const q = (document.getElementById("hq") || {}).value?.trim();
  if (!q) return;
  DHIST = await (await fetch("/api/deals/history?q=" + encodeURIComponent(q))).json();
  CHART_ANIM = true; drawHistory(); CHART_ANIM = false; animateEnter(document.getElementById("dhist"));
}
document.addEventListener("keydown", e => {  // Enter в полях страницы «Скидки»
  if (e.key !== "Enter" || !e.target.id) return;
  if (e.target.id === "dq") dealSearch();
  else if (e.target.id === "hq") dealHistory();
  else if (e.target.id === "wq") document.querySelector('[data-wadd="1"]').click();
});
// панель разделов: нажатие на «Бюджет» сворачивает до иконок, повторное — разворачивает (запоминается)
const SIDE_KEY = "budget-side";
function setSide(collapsed) {
  document.querySelector(".app").classList.toggle("collapsed", collapsed);
  try { localStorage.setItem(SIDE_KEY, collapsed ? "collapsed" : "open"); } catch (e) { /* только до перезагрузки */ }
}
document.querySelector(".side-head").title = "свернуть / развернуть список разделов";
document.querySelector(".side-head").addEventListener("click", () => setSide(!document.querySelector(".app").classList.contains("collapsed")));
try { if (localStorage.getItem(SIDE_KEY) === "collapsed") document.querySelector(".app").classList.add("collapsed"); } catch (e) { /* нет хранилища */ }

// широкие таблицы прокручиваются внутри своей карточки, а не сдвигают всю страницу
new MutationObserver(() => {
  for (const tb of document.querySelectorAll("#main table")) {
    if (tb.parentElement.classList.contains("tscroll") || tb.parentElement.closest("table")) continue;
    const w = document.createElement("div");
    w.className = "tscroll"; tb.before(w); w.appendChild(tb);
  }
}).observe(document.getElementById("main"), {childList: true, subtree: true});

// поиск в шапке: по названию товара или магазину (с задержкой, чтобы не перерисовывать на каждую букву)
let qTimer = null;
const qInput = document.getElementById("q");
qInput.addEventListener("input", () => { clearTimeout(qTimer); qTimer = setTimeout(() => { S.F.q = qInput.value.trim(); render(); }, 200); });
qInput.addEventListener("keydown", e => { if (e.key === "Escape") { qInput.value = ""; S.F.q = ""; render(); } });

document.querySelector(".logo").innerHTML = ICON.logo;
document.getElementById("qicon").innerHTML = ICON.search;
applyTheme(document.documentElement.dataset.theme);
load();
</script>
</body>
</html>
